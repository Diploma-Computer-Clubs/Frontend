<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underlie - Регистрация клуба</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        :root {
            --bg-dark: #333333;
            --field-bg: #2d2d2d;
            --card-bg: #2a2a2a;
            --text-main: #ffffff;
            --accent-green: #00ff00;
            --bg-light: #cccccc;
            --danger: #ff453a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        .burger-menu { background: none; border: none; display: flex; flex-direction: column; gap: 5px; cursor: pointer; z-index: 1001; }
        .burger-bar { width: 25px; height: 2px; background-color: #fff; transition: 0.3s; }
        .burger-menu.open .burger-bar:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .burger-menu.open .burger-bar:nth-child(2) { opacity: 0; }
        .burger-menu.open .burger-bar:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        .side-drawer {
            position: fixed; top: 0; left: 0; width: 280px; height: 100vh;
            background-color: #2d2d2d; z-index: 1000; transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        .side-drawer.open { transform: translateX(0); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 999; }
        .overlay.active { display: block; }

        .user-block { padding: 60px 25px 30px; background-color: #262626; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .user-name { font-weight: 700; color: #fff; display: block; }
        .user-phone { font-size: 0.8rem; color: #888; margin-top: 5px; display: block; }
        .drawer-nav { display: flex; flex-direction: column; }
        .drawer-link { display: flex; align-items: center; padding: 18px 25px; color: #fff; text-decoration: none; font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .drawer-link span { margin-right: 15px; color: #888; }
        .drawer-link.logout { color: #ff6b6b; border-top: 1px solid rgba(255,255,255,0.07); }
        .drawer-link.logout span { color: #ff6b6b; }

        .phone-container { width: 100%; max-width: 430px; display: flex; flex-direction: column; padding: 20px; padding-bottom: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 40px; width: 100%; }
        .header h1 { font-size: 20px; font-weight: 700; text-transform: uppercase; }

        .section-title { color: var(--bg-light); font-size: 12px; font-weight: 700; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.7; }

        .field-group { position: relative; margin-bottom: 25px; }
        .field-group label {
            position: absolute; top: -10px; left: 12px;
            background-color: var(--bg-dark); padding: 0 8px;
            font-size: 11px; font-weight: 700; color: var(--bg-light); z-index: 1;
        }
        .field-group input, .select-wrapper select, .field-group textarea {
            width: 100%; background: var(--field-bg);
            border: 1px solid #555; border-radius: 12px;
            padding: 16px; color: white; font-size: 16px; outline: none;
            transition: border-color 0.3s; font-family: 'Montserrat', sans-serif;
        }
        .field-group input:focus, .select-wrapper select:focus, .field-group textarea:focus {
            border-color: var(--accent-green);
        }
        .field-group textarea { resize: vertical; min-height: 80px; }

        .select-wrapper { position: relative; }
        .select-wrapper select { appearance: none; cursor: pointer; }
        .select-wrapper::after {
            content: ""; position: absolute; right: 15px; top: 50%;
            width: 8px; height: 8px; border-right: 2px solid #aaa; border-bottom: 2px solid #aaa;
            transform: translateY(-70%) rotate(45deg); pointer-events: none;
        }
        select option { background: #2d2d2d; color: white; }

        .media-block {
            background: var(--card-bg); border: 1px solid #444;
            border-radius: 12px; padding: 14px; margin-bottom: 20px;
        }
        .media-block-title {
            font-size: 11px; font-weight: 700; color: var(--bg-light);
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
        }
        .img-preview {
            width: 100%; height: 140px; border-radius: 10px;
            object-fit: cover; margin-bottom: 10px;
            background: var(--field-bg); border: 1px solid #555;
            display: none;
        }
        .img-preview.visible { display: block; }
        .preview-empty {
            width: 100%; height: 140px; border-radius: 10px; margin-bottom: 10px;
            background: var(--field-bg); border: 1px dashed #555;
            display: flex; align-items: center; justify-content: center;
            color: #555; font-size: 11px; font-weight: 700; text-transform: uppercase;
        }
        .preview-empty.hidden { display: none; }
        .upload-btn {
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 12px; border-radius: 10px; cursor: pointer;
            border: 1.5px dashed rgba(0,255,0,0.35); background: rgba(0,255,0,0.06);
            color: var(--accent-green); font-size: 11px; font-weight: 700;
            text-transform: uppercase; transition: 0.2s;
        }
        .upload-btn:hover { background: rgba(0,255,0,0.12); border-color: var(--accent-green); }
        .upload-btn.uploading { opacity: 0.6; pointer-events: none; }
        .upload-btn input { display: none; }
        .upload-status { font-size: 10px; color: #666; margin-top: 8px; min-height: 14px; word-break: break-all; }
        .upload-status.ok { color: var(--accent-green); }
        .upload-status.err { color: var(--danger); }

        .save-btn {
            width: 100%; background: transparent;
            border: 1px solid var(--accent-green); color: var(--accent-green);
            padding: 18px; border-radius: 12px;
            font-size: 14px; font-weight: 700; margin-top: 10px;
            cursor: pointer; transition: 0.3s;
            text-transform: uppercase; font-family: 'Montserrat', sans-serif;
        }
        .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .save-btn:not(:disabled):active { background: var(--accent-green); color: black; }

        .error-box {
            display: none; background: rgba(255, 69, 58, 0.12);
            border: 1px solid var(--danger); color: var(--danger);
            border-radius: 12px; padding: 14px 16px;
            font-size: 13px; line-height: 1.6; white-space: pre-wrap; margin-top: 14px;
        }
        .error-box.visible { display: block; }
        .success-box {
            display: none; background: rgba(0, 255, 0, 0.08);
            border: 1px solid var(--accent-green); color: var(--accent-green);
            border-radius: 12px; padding: 14px 16px;
            font-size: 13px; line-height: 1.6; margin-top: 14px;
        }
        .success-box.visible { display: block; }
    </style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<nav class="side-drawer" id="sideDrawer">
    <div class="user-block">
        <span class="user-name" id="drawer_name">Загрузка...</span>
        <span class="user-phone" id="drawer_phone">...</span>
    </div>
    <div class="drawer-nav">
        <a href="mainpage.html" class="drawer-link"><span class="material-symbols-outlined">home</span> Главная</a>
        <a href="profile.html" class="drawer-link"><span class="material-symbols-outlined">account_circle</span> Профиль</a>
        <a href="map.html" class="drawer-link"><span class="material-symbols-outlined">search</span> Карта клубов</a>
        <a href="booking.html" class="drawer-link"><span class="material-symbols-outlined">diamond</span> Бронь</a>
        <a href="#" class="drawer-link logout" id="logoutLink"><span class="material-symbols-outlined">logout</span> Выйти</a>
    </div>
</nav>

<div class="phone-container">
    <div class="header">
        <button class="burger-menu" id="burger">
            <span class="burger-bar"></span>
            <span class="burger-bar"></span>
            <span class="burger-bar"></span>
        </button>
        <h1>Регистрация клуба</h1>
        <div style="width: 25px;"></div>
    </div>

    <p class="section-title">Данные клуба</p>

    <div class="field-group">
        <label>Город</label>
        <div class="select-wrapper">
            <select id="city_id">
                <option value="" disabled selected>Загрузка городов...</option>
            </select>
        </div>
    </div>

    <div class="field-group">
        <label>Название</label>
        <input type="text" id="name" placeholder="Underlie Arena">
    </div>

    <div class="field-group">
        <label>Адрес</label>
        <input type="text" id="address" placeholder="ул. Абая, 10">
    </div>

    <div class="field-group">
        <label>Описание</label>
        <textarea id="description" rows="3" placeholder="Опишите клуб..."></textarea>
    </div>

    <p class="section-title">Медиа</p>

    <div class="media-block">
        <div class="media-block-title">Лого клуба</div>
        <div class="preview-empty" id="empty1">Нет изображения</div>
        <img class="img-preview" id="imgPreview1" alt="Лого">
        <input type="hidden" id="image_url">
        <label class="upload-btn" id="uploadBtn1">
            <span class="material-symbols-outlined" style="font-size:18px;">upload</span>
            <span>Загрузить лого</span>
            <input type="file" accept="image/*" data-field="image_url" data-preview="imgPreview1" data-status="status1">
        </label>
        <div class="upload-status" id="status1"></div>
    </div>

    <div class="media-block">
        <div class="media-block-title">Прайс-лист (фото)</div>
        <div class="preview-empty" id="empty3">Нет изображения</div>
        <img class="img-preview" id="imgPreview3" alt="Прайс">
        <input type="hidden" id="image_price_url">
        <label class="upload-btn" id="uploadBtn3">
            <span class="material-symbols-outlined" style="font-size:18px;">upload</span>
            <span>Загрузить прайс</span>
            <input type="file" accept="image/*" data-field="image_price_url" data-preview="imgPreview3" data-status="status3">
        </label>
        <div class="upload-status" id="status3"></div>
    </div>

    <div class="media-block">
        <div class="media-block-title">Фон клуба</div>
        <div class="preview-empty" id="empty2">Нет изображения</div>
        <img class="img-preview" id="imgPreview2" alt="Фон">
        <input type="hidden" id="img_background">
        <label class="upload-btn" id="uploadBtn2">
            <span class="material-symbols-outlined" style="font-size:18px;">upload</span>
            <span>Загрузить фон</span>
            <input type="file" accept="image/*" data-field="img_background" data-preview="imgPreview2" data-status="status2">
        </label>
        <div class="upload-status" id="status2"></div>
    </div>

    <button class="save-btn" id="createBtn">Создать клуб</button>
    <div class="error-box" id="errorBox"></div>
    <div class="success-box" id="successBox"></div>
</div>

<script>
    (function() { if (!localStorage.getItem('access_token')) window.location.replace('check.html'); })();

    const _API = 'http://138.16.224.101:8000/';
    const _api = axios.create({ baseURL: _API, headers: { "ngrok-skip-browser-warning": "69420" } });

    _api.interceptors.request.use(cfg => {
        const t = localStorage.getItem('access_token');
        if (t) cfg.headers.Authorization = 'Bearer ' + t;
        return cfg;
    });

    _api.interceptors.response.use(r => r, async err => {
        if (err.response?.status === 401 && !err.config._retry) {
            err.config._retry = true;
            const rt = localStorage.getItem('refresh_token');
            if (rt) {
                try {
                    const r = await axios.post(_API + 'auth/refresh', {}, {
                        headers: { "Authorization": 'Bearer ' + rt, "ngrok-skip-browser-warning": "69420" }
                    });
                    localStorage.setItem('access_token', r.data.access_token);
                    err.config.headers.Authorization = 'Bearer ' + r.data.access_token;
                    return _api(err.config);
                } catch { localStorage.clear(); window.location.href = 'check.html'; }
            } else { localStorage.clear(); window.location.href = 'check.html'; }
        }
        return Promise.reject(err);
    });

    const burger = document.getElementById('burger');
    const drawer = document.getElementById('sideDrawer');
    const overlay = document.getElementById('overlay');
    burger.addEventListener('click', () => { burger.classList.toggle('open'); drawer.classList.toggle('open'); overlay.classList.toggle('active'); });
    overlay.addEventListener('click', () => { burger.classList.remove('open'); drawer.classList.remove('open'); overlay.classList.remove('active'); });
    document.getElementById('logoutLink').addEventListener('click', e => { e.preventDefault(); localStorage.clear(); window.location.href = 'check.html'; });

    function mediaUrl(path) {
        if (!path || path === 'string') return '';
        if (path.startsWith('http://') || path.startsWith('https://')) return path;
        return _API + path.replace(/^\//, '');
    }

    function setPreview(path, previewId) {
        const img = document.getElementById(previewId);
        const emptyId = previewId.replace('imgPreview', 'empty');
        const empty = document.getElementById(emptyId);
        const url = mediaUrl(path);
        if (url) {
            img.src = url;
            img.classList.add('visible');
            empty?.classList.add('hidden');
            img.onerror = () => {
                img.classList.remove('visible');
                img.removeAttribute('src');
                empty?.classList.remove('hidden');
            };
        } else {
            img.classList.remove('visible');
            img.removeAttribute('src');
            empty?.classList.remove('hidden');
        }
    }

    function extractMediaPath(data) {
        if (data == null) return null;
        if (typeof data === 'string') {
            const s = data.trim().replace(/^"|"$/g, '');
            return (s && s !== 'string') ? s : null;
        }
        if (typeof data !== 'object') return null;
        if (typeof data.image_url === 'string' && data.image_url.trim() && data.image_url !== 'string') {
            return data.image_url.trim();
        }
        const fallback = [data.path, data.url, data.name, data.filename];
        for (const v of fallback) {
            if (typeof v === 'string' && v.trim() && v !== 'string') return v.trim();
        }
        return null;
    }

    // Храним выбранные файлы в памяти
    const pendingFiles = { image_url: null, image_price_url: null, img_background: null };

    // При выборе файла — показываем превью через blob, сохраняем в pendingFiles
    document.querySelectorAll('.upload-btn input[type="file"]').forEach(input => {
        input.addEventListener('change', e => {
            const file = e.target.files?.[0];
            if (!file) return;
            const fieldId  = input.dataset.field;
            const previewId = input.dataset.preview;
            const statusId  = input.dataset.status;

            if (!file.type.startsWith('image/')) {
                document.getElementById(statusId).textContent = 'Только изображения';
                document.getElementById(statusId).className = 'upload-status err';
                return;
            }
            if (file.size > 10 * 1024 * 1024) {
                document.getElementById(statusId).textContent = 'Файл слишком большой (макс. 10 МБ)';
                document.getElementById(statusId).className = 'upload-status err';
                return;
            }

            // Освобождаем предыдущий blob если был
            const img = document.getElementById(previewId);
            if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);

            pendingFiles[fieldId] = file;
            img.src = URL.createObjectURL(file);
            img.classList.add('visible');
            document.getElementById(previewId.replace('imgPreview', 'empty'))?.classList.add('hidden');

            document.getElementById(statusId).textContent = 'Готово к загрузке: ' + file.name;
            document.getElementById(statusId).className = 'upload-status ok';
            e.target.value = '';
        });
    });

    // Загружаем один файл на сервер (без club_id)
    async function uploadPendingImage(fieldId, previewId, statusId, uploadBtnId) {
        const file = pendingFiles[fieldId];
        if (!file) return null;

        const btn    = document.getElementById(uploadBtnId);
        const status = document.getElementById(statusId);
        btn.classList.add('uploading');
        status.textContent = 'Загрузка...';
        status.className = 'upload-status';

        const form = new FormData();
        form.append('file', file);

        try {
            const res = await _api.post('/media/images', form);

            let path = null;
            if (typeof res.data === 'string') {
                const s = res.data.trim().replace(/^"|"$/g, '');
                if (s && s !== 'string') path = s;
            } else if (res.data && typeof res.data === 'object') {
                path = extractMediaPath(res.data);
            }

            if (!path) throw new Error('Сервер не вернул путь: ' + JSON.stringify(res.data));

            // Заменяем blob-превью на реальный URL
            const img = document.getElementById(previewId);
            if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
            setPreview(path, previewId);

            status.textContent = 'Загружено: ' + path;
            status.className = 'upload-status ok';
            return path;

        } catch (err) {
            const detail = err.response?.data?.detail;
            const msg = typeof detail === 'string' ? detail
                : Array.isArray(detail) ? detail.map(d => d.msg).join(', ')
                : err.message;
            status.textContent = (err.response?.status ? err.response.status + ': ' : '') + msg;
            status.className = 'upload-status err';
            return null;
        } finally {
            btn.classList.remove('uploading');
        }
    }

    function showError(msg) {
        const box = document.getElementById('errorBox');
        box.textContent = msg;
        box.classList.toggle('visible', !!msg);
        document.getElementById('successBox').classList.remove('visible');
    }
    function showSuccess(msg) {
        const box = document.getElementById('successBox');
        box.textContent = msg;
        box.classList.add('visible');
        document.getElementById('errorBox').classList.remove('visible');
    }

    async function loadCities() {
        const select = document.getElementById('city_id');
        try {
            const res = await _api.get('/cities');
            select.innerHTML = '<option value="" disabled selected>Выберите город</option>';
            res.data.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id; opt.dataset.cityName = c.city; opt.textContent = c.city;
                select.appendChild(opt);
            });
        } catch { select.innerHTML = '<option value="">Ошибка загрузки</option>'; }
    }

    document.getElementById('createBtn').addEventListener('click', async () => {
        const citySelect     = document.getElementById('city_id');
        const selectedOption = citySelect.options[citySelect.selectedIndex];
        const btn            = document.getElementById('createBtn');

        if (!citySelect.value) { showError("Выберите город из списка!"); return; }
        if (!document.getElementById('name').value.trim()) { showError("Введите название клуба!"); return; }

        btn.disabled = true;
        showError("");

        // ШАГ 1: сначала загружаем все медиа файлы
        btn.textContent = "Загрузка медиа...";
        const [logoPath, pricePath, bgPath] = await Promise.all([
            uploadPendingImage('image_url',       'imgPreview1', 'status1', 'uploadBtn1'),
            uploadPendingImage('image_price_url', 'imgPreview3', 'status3', 'uploadBtn3'),
            uploadPendingImage('img_background',  'imgPreview2', 'status2', 'uploadBtn2'),
        ]);

        // ШАГ 2: создаём клуб с готовыми путями сразу
        btn.textContent = "Создание...";
        const payload = {
            name:            document.getElementById('name').value.trim(),
            address:         document.getElementById('address').value.trim(),
            description:     document.getElementById('description').value.trim(),
            image_url:       logoPath  || "string",
            image_price_url: pricePath || "string",
            img_background:  bgPath    || "string",
            promos:          [],
            city_id:         Number(citySelect.value),
            city_name:       selectedOption ? selectedOption.dataset.cityName : "",
            rating:          5
        };

        let clubId = null;
        try {
            const res = await _api.post('/clubs', payload);
            clubId = res.data.id;
            localStorage.setItem('owner_club_id', clubId);
        } catch (err) {
            const status = err.response?.status;
            const detail = err.response?.data?.detail;
            let msg = "";
            if (status === 403) msg = "403 Forbidden — у аккаунта нет роли owner.";
            else if (Array.isArray(detail)) msg = status + ' Validation:\n' + detail.map(d => '• ' + d.loc?.join('.') + ' — ' + d.msg).join('\n');
            else if (typeof detail === 'string') msg = status + ': ' + detail;
            else msg = (status || '?') + ' Error:\n' + JSON.stringify(err.response?.data, null, 2);
            showError(msg);
            btn.disabled = false;
            btn.textContent = "Создать клуб";
            return;
        }

        showSuccess("Клуб создан! Переходим к панели управления...");
        setTimeout(() => {
            window.location.href = 'admin_dashboard.html?club_id=' + clubId + '&new=1';
        }, 1200);

        btn.disabled = false;
        btn.textContent = "Создать клуб";
    });

    document.addEventListener('DOMContentLoaded', async () => {
        loadCities();
        try {
            const res = await _api.get('/users/me');
            document.getElementById('drawer_name').textContent = res.data.full_name || "Пользователь";
            document.getElementById('drawer_phone').textContent = res.data.phone_number || "";
        } catch {}
    });
</script>
</body>
</html>
