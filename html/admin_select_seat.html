<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ — Выбор места</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* ── HEADER ── */
        .slide-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(17,17,17,0.97);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 16px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            text-align: center;
        }

        .header-top {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .back-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            border-radius: 10px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            text-decoration: none;
            transition: background 0.2s;
        }
        .back-btn:active { background: rgba(255,255,255,0.18); }

        .admin-badge {
            background: #8b1a1a;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .logout-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.35);
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 18px;
            padding: 4px;
            transition: color 0.2s;
        }
        .logout-btn:hover { color: #ff6b6b; }

        .club-logo-frame {
            width: 50px; height: 50px;
            border-radius: 12px;
            background: #222;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            margin-bottom: 6px;
            display: flex; align-items: center; justify-content: center;
        }
        .club-logo-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .club-logo-placeholder { font-size: 20px; color: rgba(255,255,255,0.3); font-weight: 700; }

        .club-name { font-size: 15px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .club-address { font-size: 10px; color: rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 2px; }

        /* ── TIME PICKER BAR ── */
        .time-bar {
            width: 100%;
            max-width: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-top: 14px;
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 4px 8px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .time-group {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 4px 8px;
            border-radius: 8px;
            gap: 6px;
        }

        .time-bar input[type="time"] {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            width: 65px;
            cursor: pointer;
        }
        .time-bar input[type="time"]::-webkit-calendar-picker-indicator { display: none; }

        .time-sep { color: rgba(255,255,255,0.2); font-size: 12px; }

        .ws-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #444;
            margin-left: 6px;
        }
        .ws-dot.connected { background: #4CAF50; box-shadow: 0 0 8px #4CAF50; }
        .ws-dot.error     { background: #ff4d4d; }

        .time-confirm-btn {
            background: #8b1a1a;
            border: none;
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .time-confirm-btn:active { transform: scale(0.95); background: #a32424; }

        /* ── MAP ── */
        .map-wrapper {
            flex: 1;
            position: relative;
            overflow: auto;
            background: #0a0a0a;
            -webkit-overflow-scrolling: touch;
        }
        .map-wrapper::before {
            content: ''; position: sticky; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139,26,26,0.4), transparent);
            display: block; z-index: 5;
        }

        .floor-canvas {
            position: relative; margin: 16px auto 24px;
            background: #0a0a0a;
            border: 1px solid #1e1e1e; border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.03);
            min-width: 320px; min-height: 280px;
        }
        .floor-canvas.has-bg {
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }
        .floor-canvas::after {
            content: ''; position: absolute; inset: 0; border-radius: 16px;
            background: rgba(0,0,0,0.55); pointer-events: none; z-index: 1;
        }
        .floor-canvas.has-bg .map-layer { z-index: 2; position: relative; }

        .map-layer { position: absolute; inset: 0; }

        .map-obj-wall { position: absolute; background: #fff; border-radius: 0; z-index: 2; pointer-events: none; }
        .map-obj-facility {
            position: absolute; border: 2px solid rgba(255,255,255,0.35); border-radius: 2px;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.5);
            text-transform: uppercase; letter-spacing: 0.5px; pointer-events: none; z-index: 3;
        }
        .map-obj-desk .desk-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.5); border-radius: 1px; }
        .map-obj-desk .desk-lbl { font-size: 8px; color: rgba(255,255,255,0.4); margin-top: 3px; text-transform: lowercase; }

        .zone-label {
            position: absolute; display: flex; align-items: center; gap: 5px;
            z-index: 10; pointer-events: none;
        }
        .zone-label-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .zone-label-text {
            font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.75);
            text-transform: lowercase; letter-spacing: 0.2px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.9);
        }

        .pc {
            position: absolute; width: 28px; height: 28px; border-radius: 3px;
            border: 2px solid; display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s, background 0.15s;
            z-index: 20; box-sizing: border-box;
        }
        .pc:active { transform: scale(0.94); }
        .pc.free { background: #f2f2f2; color: #111; }
        .pc.busy { background: #161616; border-color: #2a2a2a !important; color: #333 !important; cursor: default; }
        .pc.offline { background: #0d0d0d; border-color: #222 !important; opacity: 0.45; cursor: default; }
        .pc.selected {
            background: #8b1a1a !important; border-color: #ff4d4d !important;
            color: #fff !important; box-shadow: 0 0 14px rgba(255,77,77,0.45);
        }
        .pc.vip.free { background: #1a0a0a; border-color: #8b1a1a; color: #ff8a8a; }
        .pc.vip.selected { background: #ff4d4d !important; color: #000 !important; }

        .map-loading {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #555; font-size: 12px; font-weight: 600; z-index: 50;
        }

        /* Легенда */
        .map-legend {
            display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; justify-content: center;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 9px; color: #666; font-weight: 600; }
        .legend-dot { width: 10px; height: 10px; border-radius: 2px; border: 1px solid #444; }
        .legend-dot.free { background: #f0f0f0; border-color: #ccc; }
        .legend-dot.busy { background: #1a1a1a; }
        .legend-dot.sel { background: #8b1a1a; border-color: #ff4d4d; }

        /* ── FOOTER ── */
        .footer {
            background: #000;
            padding: 16px 16px 26px;
            border-top: 1px solid #1a1a1a;
            z-index: 20;
        }

        .date-selector {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 16px;
        }

        .date-item {
            flex: 1;
            max-width: 80px;
            height: 50px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .date-item.active { background: #8b1a1a; color: #fff; border-color: rgba(255,255,255,0.1); }
        .date-item span { font-size: 9px; color: #666; text-transform: uppercase; }
        .date-item.active span { color: #eee; }
        .date-item b { font-size: 16px; font-weight: 700; }

        .info-box { margin-bottom: 16px; }
        .info-label { font-size: 12px; color: #888; margin-bottom: 2px; }
        .info-value { font-size: 14px; font-weight: 700; line-height: 1.4; }
        .info-value span { color: #ff4d4d; }

        .btn-confirm {
            width: 100%;
            padding: 16px;
            background: #333; color: #666;
            border: none; border-radius: 14px;
            font-size: 15px; font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            pointer-events: none;
            font-family: 'Montserrat', sans-serif;
        }
        .btn-confirm.active { background: #8b1a1a; color: #fff; pointer-events: auto; }

        /* ── PC TOOLTIP ── */
        .pc-tooltip {
            position: fixed;
            z-index: 9998;
            background: rgba(15, 15, 15, 0.97);
            border: 1px solid rgba(139, 26, 26, 0.6);
            border-radius: 12px;
            padding: 10px 14px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(6px) scale(0.97);
            transition: opacity 0.18s ease, transform 0.18s ease;
            box-shadow: 0 8px 28px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
            min-width: 170px;
            max-width: 230px;
        }
        .pc-tooltip.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .pc-tooltip-header {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 8px;
        }
        .pc-tooltip-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #ff4d4d;
            box-shadow: 0 0 6px #ff4d4d;
            flex-shrink: 0;
        }
        .pc-tooltip-title {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255,255,255,0.45);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .pc-tooltip-name {
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pc-tooltip-time {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 6px 10px;
        }
        .pc-tooltip-time-icon {
            font-size: 14px;
            color: rgba(255,255,255,0.4);
        }
        .pc-tooltip-time-text {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.3px;
        }

        /* ── CHECK-IN BUTTON IN TOOLTIP ── */
        .pc-tooltip-checkin-btn {
            margin-top: 8px;
            width: 100%;
            padding: 8px 10px;
            background: rgba(76, 175, 80, 0.15);
            border: 1px solid rgba(76, 175, 80, 0.4);
            border-radius: 8px;
            color: #4CAF50;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .pc-tooltip-checkin-btn:hover {
            background: rgba(76, 175, 80, 0.28);
            border-color: rgba(76, 175, 80, 0.7);
        }
        .pc-tooltip-checkin-btn:active { transform: scale(0.97); }
        .pc-tooltip-checkin-btn.checked-in {
            background: rgba(255, 59, 59, 0.15);
            border-color: rgba(255, 59, 59, 0.45);
            color: #ff6b6b;
        }
        .pc-tooltip-checkin-btn.checked-in:hover {
            background: rgba(255, 59, 59, 0.28);
            border-color: rgba(255, 59, 59, 0.7);
            color: #ff4d4d;
        }
        .pc-tooltip-checkin-btn.loading {
            opacity: 0.6;
            cursor: default;
            pointer-events: none;
        }

        /* ── PC CONTEXT MENU ── */
        .pc-ctx-overlay {
            position: fixed; inset: 0; z-index: 9990;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(2px); display: none;
        }
        .pc-ctx-overlay.visible { display: block; }
        .pc-ctx-menu {
            position: fixed; z-index: 9991; background: #111;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
            padding: 8px; min-width: 200px; box-shadow: 0 16px 40px rgba(0,0,0,0.8);
            transform: scale(0.92) translateY(6px); opacity: 0;
            transition: opacity 0.15s ease, transform 0.15s ease; pointer-events: none;
        }
        .pc-ctx-menu.visible { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }
        .pc-ctx-title {
            font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.35);
            text-transform: uppercase; letter-spacing: 1px; padding: 6px 10px 10px;
        }
        .pc-ctx-btn {
            width: 100%; display: flex; align-items: center; gap: 10px;
            background: none; border: none; color: #fff; padding: 12px;
            border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
            font-family: 'Montserrat', sans-serif; transition: background 0.15s; text-align: left;
        }
        .pc-ctx-btn:hover { background: rgba(255,255,255,0.07); }
        .pc-ctx-btn.turn-on     { color: #4CAF50; }
        .pc-ctx-btn.turn-off    { color: #ff6b6b; }
        .pc-ctx-btn.delete-book { color: #ff9800; }
        .pc-ctx-btn .material-symbols-outlined { font-size: 18px; }
        .pc-ctx-divider { height: 1px; background: rgba(255,255,255,0.07); margin: 4px 0; }

        /* Confirm delete modal */
        .del-modal-overlay {
            position: fixed; inset: 0; z-index: 9995;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
        }
        .del-modal-overlay.visible { display: flex; }
        .del-modal {
            background: #111; border: 1px solid rgba(255,100,0,0.3);
            border-radius: 18px; padding: 24px 20px 20px;
            min-width: 280px; max-width: 320px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .del-modal-icon { font-size: 32px; text-align: center; margin-bottom: 12px; }
        .del-modal-title { font-size: 15px; font-weight: 800; text-align: center; margin-bottom: 6px; }
        .del-modal-sub { font-size: 12px; color: rgba(255,255,255,0.45); text-align: center; margin-bottom: 18px; line-height: 1.5; }
        .del-modal-booking {
            background: rgba(255,255,255,0.05); border-radius: 10px;
            padding: 10px 14px; margin-bottom: 16px;
        }
        .del-modal-booking-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
        .del-modal-booking-time { font-size: 12px; color: rgba(255,255,255,0.5); display: flex; align-items: center; gap: 6px; }
        .del-modal-btns { display: flex; gap: 10px; }
        .del-modal-cancel {
            flex: 1; padding: 13px; background: rgba(255,255,255,0.06);
            border: none; border-radius: 12px; color: #fff;
            font-size: 13px; font-weight: 700; cursor: pointer;
            font-family: 'Montserrat', sans-serif; transition: 0.2s;
        }
        .del-modal-cancel:active { background: rgba(255,255,255,0.12); }
        .del-modal-confirm {
            flex: 1; padding: 13px; background: #8b1a1a;
            border: none; border-radius: 12px; color: #fff;
            font-size: 13px; font-weight: 700; cursor: pointer;
            font-family: 'Montserrat', sans-serif; transition: 0.2s;
        }
        .del-modal-confirm:active { background: #a32424; transform: scale(0.97); }

        /* ── TOAST ── */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast {
            background: #1a1a1a; color: #fff;
            padding: 14px 18px; border-radius: 12px; margin-bottom: 10px;
            border-left: 4px solid #8b1a1a;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 10px;
            font-size: 13px; font-weight: 700; min-width: 250px;
            animation: slideIn 0.3s ease-out forwards;
        }
        .toast.success { border-left-color: #4CAF50; }
        @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { to { transform: translateX(120%); opacity: 0; } }
    </style>
</head>
<body>

    <div class="slide-header">
        <div class="header-top">
            <a href="admin_select_time.html" class="back-btn" id="backBtn">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <span class="admin-badge">Админ</span>
            <button class="logout-btn" onclick="logout()">
                <span class="material-symbols-outlined">logout</span>
            </button>
        </div>

        <div class="club-logo-frame">
            <img id="clubLogoImg" class="club-logo-img" src="" alt="">
            <div id="clubLogoPlaceholder" class="club-logo-placeholder">🎮</div>
        </div>

        <span class="club-name" id="clubNameHeader">Загрузка...</span>
        <span class="club-address" id="clubAddrHeader">
            <span class="material-symbols-outlined" style="font-size:12px">location_on</span> —
        </span>

        <div class="map-legend">
            <div class="legend-item"><span class="legend-dot free"></span> свободно</div>
            <div class="legend-item"><span class="legend-dot busy"></span> занято</div>
            <div class="legend-item"><span class="legend-dot sel"></span> выбрано</div>
        </div>

        <div class="time-bar">
            <div class="time-group">
                <input type="time" id="pickerStart">
                <span class="time-sep">/</span>
                <input type="time" id="pickerEnd">
                <div class="ws-dot" id="wsDot"></div>
            </div>
            <button class="time-confirm-btn" id="confirmTimeBtn" onclick="confirmTimeAndConnect()">OK</button>
        </div>
    </div>

    <div class="map-wrapper" id="mapWrapper">
        <div class="floor-canvas" id="floorCanvas">
            <div class="map-layer" id="mapObjectsLayer"></div>
            <div class="map-layer" id="zoneLabelsLayer"></div>
            <div class="map-layer" id="pcsLayer"></div>
            <div class="map-loading" id="mapLoading">Загрузка схемы…</div>
        </div>
    </div>

    <div class="footer">
        <div class="date-selector" id="dateSelector"></div>
        <div class="info-box">
            <div class="info-label">Выбранное место:</div>
            <div class="info-value" id="seatLabel"><span>не выбрано</span></div>
            <div class="info-label" style="margin-top:8px">Время:</div>
            <div class="info-value" id="timeLabel">--:--</div>
        </div>
        <button class="btn-confirm" id="confirmBtn" onclick="handleBooking()">Подтвердить бронирование</button>
    </div>

<!-- Tooltip -->
<div class="pc-tooltip" id="pcTooltip">
    <div class="pc-tooltip-header">
        <div class="pc-tooltip-dot"></div>
        <span class="pc-tooltip-title">Занято</span>
    </div>
    <div class="pc-tooltip-name" id="tooltipName"></div>
    <div class="pc-tooltip-time">
        <span class="material-symbols-outlined pc-tooltip-time-icon">schedule</span>
        <span class="pc-tooltip-time-text" id="tooltipTime"></span>
    </div>
    <button class="pc-tooltip-checkin-btn" id="tooltipCheckinBtn" onclick="checkInFromTooltip(event)">
        <span class="material-symbols-outlined" style="font-size:15px">how_to_reg</span>
        Отметить приход
    </button>
</div>

<!-- PC Context Menu -->
<div class="pc-ctx-overlay" id="pcCtxOverlay" onclick="closeCtxMenu()"></div>
<div class="pc-ctx-menu" id="pcCtxMenu">
    <div class="pc-ctx-title" id="pcCtxTitle">ПК №—</div>
    <div class="pc-ctx-divider"></div>
    <button class="pc-ctx-btn turn-on" id="pcCtxTurnOn" onclick="togglePc(true)">
        <span class="material-symbols-outlined">power</span> Включить
    </button>
    <button class="pc-ctx-btn turn-off" id="pcCtxTurnOff" onclick="togglePc(false)">
        <span class="material-symbols-outlined">power_off</span> Выключить
    </button>
    <div class="pc-ctx-divider" id="pcCtxDelDivider" style="display:none"></div>
    <button class="pc-ctx-btn delete-book" id="pcCtxDeleteBook" style="display:none" onclick="openDeleteModal()">
        <span class="material-symbols-outlined">event_busy</span> Удалить бронь
    </button>
</div>

<!-- Delete booking confirmation modal -->
<div class="del-modal-overlay" id="delModalOverlay">
    <div class="del-modal">
        <div class="del-modal-icon">🗑️</div>
        <div class="del-modal-title">Удалить бронирование?</div>
        <div class="del-modal-sub">Это действие нельзя отменить</div>
        <div class="del-modal-booking" id="delModalBookingInfo">
            <div class="del-modal-booking-name" id="delModalName">—</div>
            <div class="del-modal-booking-time">
                <span class="material-symbols-outlined" style="font-size:14px;color:rgba(255,255,255,0.4)">schedule</span>
                <span id="delModalTime">—</span>
            </div>
        </div>
        <div class="del-modal-btns">
            <button class="del-modal-cancel" onclick="closeDeleteModal()">Отмена</button>
            <button class="del-modal-confirm" id="delModalConfirmBtn" onclick="confirmDeleteBooking()">Удалить</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
// ── ИСПРАВЛЕНО: убран слэш в конце WS_URL ──
const API_URL = 'http://138.16.224.101:8000';
const WS_URL  = 'http://138.16.224.101:8000';

const params  = new URLSearchParams(window.location.search);
const clubId  = params.get('club_id');

if (!clubId) { window.location.href = 'admin_select_time.html'; }

function getNowTime() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function getTimeInThreeHours() {
    const d = new Date(Date.now() + 3 * 60 * 60 * 1000);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function getTodayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDayISO(iso) {
    const d = new Date(iso);
    d.setDate(d.getDate() + 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

let startTime          = getNowTime();
let endTime            = getTimeInThreeHours();
let selectedDateStr    = getTodayISO();
let selectedEndDateStr = getTodayISO();

let selected         = [];
let availabilityData = [];
let ws               = null;
let wsConnected      = false;
let timeConfirmed    = false;

function logout() { localStorage.clear(); window.location.href = 'check.html'; }

function showToast(message, type = 'error') {
    let container = document.querySelector('.toast-container');
    if (!container) {
        container = document.createElement('div');
        container.className = 'toast-container';
        document.body.appendChild(container);
    }
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<span class="material-symbols-outlined">${type === 'success' ? 'check_circle' : 'info'}</span> ${message}`;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.animation = 'slideOut 0.4s ease-in forwards';
        setTimeout(() => toast.remove(), 400);
    }, 3000);
}

const api = axios.create({ baseURL: API_URL, headers: { "ngrok-skip-browser-warning": "69420" } });
api.interceptors.request.use(cfg => {
    const t = localStorage.getItem('access_token');
    if (t) cfg.headers.Authorization = `Bearer ${t}`;
    return cfg;
});
api.interceptors.response.use(r => r, async err => {
    const orig = err.config;
    if (err.response?.status === 401 && !orig._retry) {
        orig._retry = true;
        const rt = localStorage.getItem('refresh_token');
        if (rt) {
            try {
                const r = await axios.post(`${API_URL}/auth/refresh`, {}, {
                    headers: { "Authorization": `Bearer ${rt}`, "ngrok-skip-browser-warning": "69420" }
                });
                localStorage.setItem('access_token', r.data.access_token);
                orig.headers.Authorization = `Bearer ${r.data.access_token}`;
                return api(orig);
            } catch { logout(); }
        } else { logout(); }
    }
    return Promise.reject(err);
});

// ── PC Toggle ──
let ctxCompId = null;
let ctxCompBookings = [];
let holdTimer = null;

function openCtxMenu(el, comp) {
    ctxCompId = comp.id;
    ctxCompBookings = comp.bookings || [];
    document.getElementById('pcCtxTitle').textContent = `ПК №${comp.number}`;
    document.getElementById('pcCtxTurnOn').style.display  = comp.is_Active ? 'none' : 'flex';
    document.getElementById('pcCtxTurnOff').style.display = comp.is_Active ? 'flex' : 'none';

    const hasBookings = ctxCompBookings.length > 0;
    document.getElementById('pcCtxDeleteBook').style.display = hasBookings ? 'flex' : 'none';
    document.getElementById('pcCtxDelDivider').style.display = hasBookings ? 'block' : 'none';

    const menu = document.getElementById('pcCtxMenu');
    const rect = el.getBoundingClientRect();
    let left = rect.left + rect.width / 2 - 100;
    let top  = rect.top - 140;
    if (top < 8) top = rect.bottom + 8;
    if (left < 8) left = 8;
    if (left + 200 > window.innerWidth - 8) left = window.innerWidth - 208;
    menu.style.left = left + 'px';
    menu.style.top  = top  + 'px';
    document.getElementById('pcCtxOverlay').classList.add('visible');
    requestAnimationFrame(() => menu.classList.add('visible'));
}

function openDeleteModal() {
    closeCtxMenu();
    if (!ctxCompBookings || ctxCompBookings.length === 0) return;
    const b = ctxCompBookings[0];
    document.getElementById('delModalName').textContent = b.full_name;
    document.getElementById('delModalTime').textContent = `${formatTime(b.start_time)} – ${formatTime(b.end_time)}`;
    document.getElementById('delModalConfirmBtn').textContent = 'Удалить';
    document.getElementById('delModalConfirmBtn').disabled = false;
    document.getElementById('delModalOverlay').classList.add('visible');
}

function closeDeleteModal() {
    document.getElementById('delModalOverlay').classList.remove('visible');
}

async function confirmDeleteBooking() {
    if (!ctxCompBookings || ctxCompBookings.length === 0) return;
    const bookingId = ctxCompBookings[0].id;
    const btn = document.getElementById('delModalConfirmBtn');
    btn.textContent = 'Удаляем...';
    btn.disabled = true;
    try {
        await api.delete(`/bookings/${bookingId}/admin`, { params: { club_id: clubId } });
        closeDeleteModal();
        showToast('Бронирование удалено', 'success');
        connectWS();
    } catch (e) {
        btn.textContent = 'Удалить';
        btn.disabled = false;
        showToast(e.response?.data?.detail || 'Ошибка при удалении');
    }
}

function closeCtxMenu() {
    document.getElementById('pcCtxMenu').classList.remove('visible');
    document.getElementById('pcCtxOverlay').classList.remove('visible');
    ctxCompId = null;
}

async function togglePc(turnOn) {
    if (!ctxCompId) return;
    const compId = ctxCompId;
    closeCtxMenu();
    try {
        await api.post(`/computers/${compId}/${turnOn ? 'turn-on' : 'turn-off'}`, {}, { params: { club_id: clubId } });
        showToast(turnOn ? 'Компьютер включён' : 'Компьютер выключен', 'success');
        connectWS();
    } catch (e) {
        showToast(e.response?.data?.detail || 'Ошибка при переключении');
    }
}

function attachPcHold(el, comp) {
    el.addEventListener('contextmenu', (e) => { e.preventDefault(); openCtxMenu(el, comp); });
    el.addEventListener('pointerdown', () => { holdTimer = setTimeout(() => openCtxMenu(el, comp), 600); });
    el.addEventListener('pointerup',   () => clearTimeout(holdTimer));
    el.addEventListener('pointerleave',() => clearTimeout(holdTimer));
}

function connectWS() {
    if (ws) { ws.onclose = null; ws.close(); }
    const dot = document.getElementById('wsDot');
    dot.className = 'ws-dot pending';

    const startISO = `${selectedDateStr}T${startTime}:00`;
    const endISO   = `${selectedEndDateStr}T${endTime}:00`;
    const token    = localStorage.getItem('access_token');

    // ── ИСПРАВЛЕНО: заменяем http→ws (или https→wss) явно в строке пути ──
    const wsBase = WS_URL.replace(/^http/, 'ws');
    const wsPath = `${wsBase}/${clubId}/availability/ws?start_time=${encodeURIComponent(startISO)}&end_time=${encodeURIComponent(endISO)}&token=${encodeURIComponent(token)}`;

    ws = new WebSocket(wsPath);
    let layoutReady = false;  // координаты считаем только один раз за сессию WS

    ws.onopen = () => { dot.className = 'ws-dot connected'; wsConnected = true; };
    ws.onmessage = async (event) => {
        try {
            const data = JSON.parse(event.data);

            if (!layoutReady) {
                // Первое сообщение: грузим mapObjects и считаем layout один раз
                layoutReady = true;
                availabilityData = Array.isArray(data) ? data : (data.zones || data.computers || []);
                try {
                    const mapRes = await api.get(`/map-objects/${clubId}/map-objects/`).catch(() => ({ data: [] }));
                    mapObjects = Array.isArray(mapRes.data) ? mapRes.data : [];
                } catch { mapObjects = []; }
                normalizeFloorCoords();   // мутирует координаты — только 1 раз!
                computeMapLayout();
                const loading = document.getElementById('mapLoading');
                if (loading) loading.style.display = 'none';
                scrollMapIntoView();
            } else {
                // Последующие обновления: только обновляем статусы броней, координаты не трогаем
                const freshZones = Array.isArray(data) ? data : (data.zones || data.computers || []);
                // Мерджим только bookings / is_Active, не перезаписывая x/y
                freshZones.forEach(freshZone => {
                    const existing = availabilityData.find(z => z.id === freshZone.id);
                    if (existing) {
                        existing.computers.forEach(pc => {
                            const freshPc = (freshZone.computers || []).find(c => c.id === pc.id);
                            if (freshPc) {
                                pc.bookings   = freshPc.bookings;
                                pc.is_Active  = freshPc.is_Active;
                                pc.is_active  = freshPc.is_active;
                            }
                        });
                    }
                });
            }

            const freeIds = new Set(
                availabilityData.flatMap(z => z.computers || [])
                    .filter(c => c.is_Active && c.bookings?.length === 0)
                    .map(c => c.id)
            );
            selected = selected.filter(s => freeIds.has(s.id));
            updateUI();
            renderMap();
        } catch (e) { console.error('WS parse error:', e); }
    };
    ws.onerror = () => { dot.className = 'ws-dot error'; wsConnected = false; fetchAvailabilityREST(); };
    ws.onclose = () => { dot.className = 'ws-dot error'; wsConnected = false; };
}

async function fetchAvailabilityREST() {
    const loading = document.getElementById('mapLoading');
    if (loading) loading.style.display = 'flex';
    const startISO = `${selectedDateStr}T${startTime}:00`;
    const endISO   = `${selectedEndDateStr}T${endTime}:00`;
    try {
        const [availRes, mapRes] = await Promise.all([
            api.get(`/clubs/${clubId}/availability`, { params: { start_time: startISO, end_time: endISO } }),
            api.get(`/map-objects/${clubId}/map-objects/`).catch(() => ({ data: [] })),
        ]);
        availabilityData = Array.isArray(availRes.data) ? availRes.data : [];
        mapObjects = Array.isArray(mapRes.data) ? mapRes.data : [];
    } catch (e) {
        console.error('Availability error:', e);
        availabilityData = [];
        mapObjects = [];
    }
    const freeIds = new Set(
        availabilityData.flatMap(z => z.computers || [])
            .filter(c => c.is_Active && c.bookings?.length === 0)
            .map(c => c.id)
    );
    selected = selected.filter(s => freeIds.has(s.id));
    normalizeFloorCoords();
    computeMapLayout();
    updateUI();
    renderMap();
    scrollMapIntoView();
    if (loading) loading.style.display = 'none';
}

function confirmTimeAndConnect(silent = false) {
    const [sh, sm] = startTime.split(':').map(Number);
    const [eh, em] = endTime.split(':').map(Number);
    if (eh * 60 + em <= sh * 60 + sm) { selectedEndDateStr = addDayISO(selectedDateStr); }
    else { selectedEndDateStr = selectedDateStr; }
    document.getElementById('timeLabel').innerText = `${startTime} – ${endTime}`;
    localStorage.setItem('booking_start_time', startTime);
    localStorage.setItem('booking_end_time', endTime);
    localStorage.setItem('booking_start_date', selectedDateStr);
    localStorage.setItem('booking_end_date', selectedEndDateStr);
    timeConfirmed = true;
    connectWS();
    if (!silent) showToast('Время обновлено', 'success');
}

async function checkInFromTooltip(e) {

    try {

            btn.classList.remove('checked-in');
            btn.innerHTML = `<span class="material-symbols-outlined" style="font-size:15px">how_to_reg</span> Отметить приход`;
        }

}

// ── Цвета зон ──
const ZONE_COLORS = ['#6b8cff', '#ff6b6b', '#34d399', '#fbbf24', '#a78bfa', '#fb923c'];
let zoneColorById = {};
let zoneNameById  = {};
let mapObjects    = [];
let mapLayout     = { ox: 0, oy: 0, w: 600, h: 480 };
const PC_SIZE_MAP = 28;
const MAP_PAD     = 48;

function apiImg(path) {
    if (!path || path === 'string') return '';
    return path.startsWith('http') ? path : `${API_URL}${path.startsWith('/') ? '' : '/'}${path}`;
}

function zoneAccent(zoneId, zoneName) {
    if (zoneColorById[zoneId]) return zoneColorById[zoneId];
    const isVip = (zoneName || '').toLowerCase().includes('vip');
    return isVip ? '#ff6b6b' : '#6b8cff';
}

function looksLikeGridCoords(items) {
    if (!items.length) return false;
    const mx = Math.max(...items.map(p => p.x ?? 0));
    const my = Math.max(...items.map(p => p.y ?? 0));
    return mx < 24 && my < 24;
}

function normalizeFloorCoords() {
    availabilityData.forEach((zone, zi) => {
        const pcs = zone.computers || [];
        const zx = zone.x ?? 0;
        const zy = zone.y ?? 0;
        const zoneGrid = looksLikeGridCoords(pcs.map(p => ({ x: p.x, y: p.y })));
        const zonePosUnset = (zx === 0 && zy === 0) || zoneGrid;

        if (zonePosUnset && zi > 0) {
            zone.x = 70 + zi * 160;
            zone.y = 100;
        } else if (zone.x == null) zone.x = zx;
        if (zone.y == null) zone.y = zy;

        if (zoneGrid && pcs.length) {
            const step = PC_SIZE_MAP + 8;
            const baseX = (zone.x || 0) + 8;
            const baseY = (zone.y || 0) + 26;
            pcs.forEach((pc, i) => {
                const gx = pc.x ?? (i % 4);
                const gy = pc.y ?? Math.floor(i / 4);
                pc.x = baseX + gx * step;
                pc.y = baseY + gy * step;
            });
        } else {
            pcs.forEach(pc => {
                pc.x = pc.x ?? 0;
                pc.y = pc.y ?? 0;
            });
        }
    });
}

function computeMapLayout() {
    const pts = [];
    availabilityData.forEach(zone => {
        if (zone.x != null && zone.y != null) pts.push({ x: zone.x, y: zone.y });
        (zone.computers || []).forEach(pc => {
            if (pc.x != null && pc.y != null) pts.push({ x: pc.x, y: pc.y, w: PC_SIZE_MAP, h: PC_SIZE_MAP });
        });
    });
    mapObjects.forEach(obj => {
        pts.push({ x: obj.x, y: obj.y, w: obj.width || 40, h: obj.height || 40 });
    });
    if (!pts.length) {
        mapLayout = { ox: MAP_PAD, oy: MAP_PAD, w: 360, h: 400 };
        return;
    }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    pts.forEach(p => {
        const w = p.w || 0; const h = p.h || 0;
        minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
        maxX = Math.max(maxX, p.x + w); maxY = Math.max(maxY, p.y + h);
    });
    mapLayout = {
        ox: MAP_PAD - minX, oy: MAP_PAD - minY,
        w: Math.max(320, maxX - minX + MAP_PAD * 2),
        h: Math.max(280, maxY - minY + MAP_PAD * 2),
    };
}

function mapX(x) { return (x || 0) + mapLayout.ox; }
function mapY(y) { return (y || 0) + mapLayout.oy; }

function scrollMapIntoView() {
    const wrap = document.getElementById('mapWrapper');
    if (!wrap) return;
    requestAnimationFrame(() => {
        wrap.scrollLeft = Math.max(0, (wrap.scrollWidth - wrap.clientWidth) / 2);
        wrap.scrollTop  = Math.max(0, (wrap.scrollHeight - wrap.clientHeight) / 4);
    });
}

function renderMapObjects(layer) {
    mapObjects.forEach(obj => {
        if (obj.type === 'wall') {
            const el = document.createElement('div');
            el.className = 'map-obj-wall';
            el.style.left = mapX(obj.x) + 'px';
            el.style.top  = mapY(obj.y) + 'px';
            el.style.width  = (obj.width  || 80) + 'px';
            el.style.height = (obj.height ||  5) + 'px';
            if (obj.rotation) el.style.transform = `rotate(${obj.rotation}deg)`;
            layer.appendChild(el);
            return;
        }
        const el = document.createElement('div');
        if (obj.type === 'admin_desk') {
            el.className = 'map-obj-desk map-obj-facility';
            el.style.left = mapX(obj.x) + 'px';
            el.style.top  = mapY(obj.y) + 'px';
            el.style.width = (obj.width || 90) + 'px';
            el.style.flexDirection = 'column';
            el.style.alignItems = 'flex-start';
            el.style.justifyContent = 'flex-end';
            el.style.border = 'none';
            el.innerHTML = `<div class="desk-bar"></div><div class="desk-lbl">${obj.label || 'стойка'}</div>`;
        } else {
            el.className = 'map-obj-facility';
            el.style.left   = mapX(obj.x) + 'px';
            el.style.top    = mapY(obj.y) + 'px';
            el.style.width  = (obj.width  || 48) + 'px';
            el.style.height = (obj.height || 40) + 'px';
            el.textContent = obj.label || (obj.type === 'toilet' ? 'WC' : '');
        }
        if (obj.rotation) el.style.transform = `rotate(${obj.rotation}deg)`;
        layer.appendChild(el);
    });
}

function renderMap() {
    const canvas   = document.getElementById('floorCanvas');
    const objLayer = document.getElementById('mapObjectsLayer');
    const lblLayer = document.getElementById('zoneLabelsLayer');
    const pcLayer  = document.getElementById('pcsLayer');
    if (!canvas || !pcLayer) return;

    canvas.style.width  = mapLayout.w + 'px';
    canvas.style.height = mapLayout.h + 'px';
    objLayer.innerHTML = '';
    lblLayer.innerHTML = '';
    pcLayer.innerHTML  = '';

    renderMapObjects(objLayer);

    availabilityData.forEach((zone, zi) => {
        if (!zone.computers || !zone.computers.length) return;

        const zName  = zone.name || zoneNameById[zone.id] || 'зона';
        const accent = zoneAccent(zone.id, zName);
        zoneColorById[zone.id] = accent;
        const isVip  = zName.toLowerCase().includes('vip');

        const lbl = document.createElement('div');
        lbl.className = 'zone-label';
        lbl.style.left = mapX(zone.x ?? 70 + zi * 140) + 'px';
        lbl.style.top  = mapY(zone.y ?? 90) + 'px';
        lbl.innerHTML  = `<span class="zone-label-dot" style="background:${accent}"></span><span class="zone-label-text">${zName}</span>`;
        lblLayer.appendChild(lbl);

        zone.computers.forEach(comp => {
            const isOffline  = comp.is_Active === false || comp.is_active === false;
            const isFree     = !isOffline && comp.bookings && comp.bookings.length === 0;
            const isSelected = !!selected.find(s => s.id === comp.id);

            const el = document.createElement('div');
            el.className = `pc${isVip ? ' vip' : ''} ${isOffline ? 'offline' : isFree ? 'free' : 'busy'}${isSelected ? ' selected' : ''}`;
            el.style.left        = mapX(comp.x) + 'px';
            el.style.top         = mapY(comp.y) + 'px';
            el.style.width       = PC_SIZE_MAP + 'px';
            el.style.height      = PC_SIZE_MAP + 'px';
            el.style.borderColor = accent;

            if (isOffline) {
                el.innerHTML = `<img src="../img/offline.png" style="width:16px;height:16px;object-fit:contain;opacity:0.55" alt="">`;
                el.title = `ПК №${comp.number} — не активен`;
            } else if (!isFree) {
                el.textContent = comp.number;
                el.style.background   = '#161616';
                el.style.borderColor  = '#2a2a2a';
                el.style.color        = '#333';
                if (comp.bookings && comp.bookings.length > 0) {
                    el.addEventListener('mouseenter', () => showPcTooltip(el, comp.bookings));
                    el.addEventListener('mouseleave', () => {
                        tooltipHideTimer = setTimeout(() => {
                            const tt = document.getElementById('pcTooltip');
                            if (tt && !tt.matches(':hover')) hidePcTooltip();
                        }, 80);
                    });
                    el.addEventListener('mousemove', () => movePcTooltip(el));
                }
            } else {
                el.textContent = comp.number;
                if (isSelected) {
                    el.classList.add('selected');
                } else if (isVip) {
                    el.style.background  = '#1a0a0a';
                    el.style.borderColor = '#8b1a1a';
                    el.style.color       = '#ff8a8a';
                }
                el.onclick = () => {
                    const i = selected.findIndex(s => s.id === comp.id);
                    if (i > -1) {
                        selected.splice(i, 1);
                        el.classList.remove('selected');
                        if (isVip) {
                            el.style.background  = '#1a0a0a';
                            el.style.borderColor = '#8b1a1a';
                            el.style.color       = '#ff8a8a';
                        } else {
                            el.style.background  = '';
                            el.style.borderColor = accent;
                            el.style.color       = '';
                        }
                    } else {
                        if (selected.length >= 5) { showToast('Максимум 5 мест'); return; }
                        selected.push({ id: comp.id, n: comp.number, zid: zone.id, isVip });
                        el.classList.add('selected');
                        el.style.background  = '';
                        el.style.borderColor = '';
                        el.style.color       = '';
                    }
                    updateUI();
                };
            }

            attachPcHold(el, comp);
            pcLayer.appendChild(el);
        });
    });

    const hasPcs = pcLayer.querySelector('.pc');
    if (!hasPcs) {
        const empty = document.createElement('div');
        empty.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#555;font-size:12px;font-weight:600;text-align:center;padding:20px;';
        empty.textContent = 'Нет данных';
        pcLayer.appendChild(empty);
    }
}

async function updateUI() {
    const btn = document.getElementById('confirmBtn');
    const label = document.getElementById('seatLabel');
    if (selected.length > 0) {
        const totalPrice = await calculatePrice();
        window.currentTotalPrice = totalPrice;
        const grouped = selected.reduce((acc, curr) => {
            const zone = curr.isVip ? "VIP" : "Стандарт";
            acc[zone] = acc[zone] || []; acc[zone].push(`№${curr.n}`);
            return acc;
        }, {});
        label.innerHTML = Object.entries(grouped).map(([z, nums]) => `${z} <b>${nums.join(', ')}</b>`).join('<br>') +
            `<br><span style="color:#4CAF50; font-size:16px;">К оплате: ${totalPrice} ₸</span>`;
        btn.classList.add('active');
    } else {
        label.innerHTML = '<span>не выбрано</span>';
        btn.classList.remove('active');
    }
}

async function calculatePrice() {
    if (selected.length === 0) return 0;
    const items = Object.entries(selected.reduce((acc, pc) => { acc[pc.zid] = (acc[pc.zid] || 0) + 1; return acc; }, {}))
        .map(([zid, count]) => ({ zone_id: parseInt(zid), count }));
    try {
        const res = await axios.post(`${API_URL}/pricing/calculate`, [{ items, start_time: `${selectedDateStr}T${startTime}:00`, end_time: `${selectedEndDateStr}T${endTime}:00` }]);
        return res.data.total_amount;
    } catch { return 0; }
}

async function handleBooking() {
    const btn = document.getElementById('confirmBtn');
    btn.innerText = "БРОНИРУЕМ...";
    try {
        const pricePerPc = window.currentTotalPrice / selected.length;
        const data = selected.map(s => ({
            "start_time": `${selectedDateStr}T${startTime}:00.000`,
            "end_time": `${selectedEndDateStr}T${endTime}:00.000`,
            "total_price": pricePerPc,
            "computer_id": s.id,
            "zone_id": s.zid,
            "club_id": parseInt(clubId)
        }));
        await api.post(`/bookings/admin`, data, { params: { club_id: clubId } });
        showToast("Успешно!", "success");
        selected = [];
        updateUI();
        connectWS();
    } catch (e) {
        showToast(e.response?.data?.detail || "Ошибка");
        btn.innerText = "ПОДТВЕРДИТЬ БРОНИРОВАНИЕ";
    }
}

async function fetchClubInfo() {
    try {
        const r = await api.get(`/clubs/${clubId}`);
        document.getElementById('clubNameHeader').innerText = r.data.name;
        document.getElementById('clubAddrHeader').innerHTML =
            `<span class="material-symbols-outlined" style="font-size:12px">location_on</span> ${r.data.address}`;

        if (r.data.image_url) {
            const img = document.getElementById('clubLogoImg');
            img.src = API_URL + r.data.image_url;
            img.style.display = 'block';
            document.getElementById('clubLogoPlaceholder').style.display = 'none';
        }

        if (r.data.img_background) {
            const canvas = document.getElementById('floorCanvas');
            canvas.style.backgroundImage = `url('${API_URL + r.data.img_background}')`;
            canvas.style.backgroundSize = 'cover';
            canvas.style.backgroundPosition = 'center';
            canvas.classList.add('has-bg');
        }
    } catch {}
}

function initCalendar() {
    const list = document.getElementById('dateSelector');
    const daysShort = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
    list.innerHTML = '';

    for (let i = 0; i < 3; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

        const item = document.createElement('div');
        item.className = `date-item ${iso === selectedDateStr ? 'active' : ''}`;

        let dayLabel = daysShort[d.getDay()];
        if (i === 0) dayLabel = "Сегодня";
        if (i === 1) dayLabel = "Завтра";

        item.innerHTML = `<span>${dayLabel}</span><b>${d.getDate()}</b>`;
        item.onclick = () => {
            document.querySelectorAll('.date-item').forEach(el => el.classList.remove('active'));
            item.classList.add('active');
            selectedDateStr = iso;
            confirmTimeAndConnect(true);
        };

        list.appendChild(item);
    }
}

document.addEventListener('DOMContentLoaded', async () => {
    try {
        const me = await api.get('/users/me');
        if (me.data.staff_role !== 'admin') { window.location.href = 'mainpage.html'; return; }
    } catch { window.location.href = 'check.html'; return; }

    document.getElementById('pickerStart').value = startTime;
    document.getElementById('pickerEnd').value   = endTime;
    document.getElementById('pickerStart').onchange = (e) => { startTime = e.target.value; confirmTimeAndConnect(true); };
    document.getElementById('pickerEnd').onchange   = (e) => { endTime   = e.target.value; confirmTimeAndConnect(true); };

    fetchClubInfo();
    initCalendar();
    document.getElementById('timeLabel').innerText = `${startTime} – ${endTime}`;
    timeConfirmed = true;

    const tt = document.getElementById('pcTooltip');
    tt.addEventListener('mouseenter', () => clearTimeout(tooltipHideTimer));
    tt.addEventListener('mouseleave', hidePcTooltip);

    connectWS();
});
</script>
</body>
</html>
