<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #080808; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .slide-header {
            position: relative; z-index: 20; flex-shrink: 0;
            background: linear-gradient(180deg, rgba(12,12,12,0.98) 0%, rgba(12,12,12,0.85) 100%);
            backdrop-filter: blur(12px);
            display: flex; flex-direction: column; align-items: center;
            padding: 16px 16px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); text-align: center;
        }
        .back-btn {
            position: absolute; left: 14px; top: 16px;
            background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff; text-decoration: none;
        }
        .back-btn:active { background: rgba(255,255,255,0.14); }

        .club-logo-frame {
            width: 64px; height: 64px; border-radius: 14px;
            background: #1a1a1a; border: 2px solid rgba(255,255,255,0.1);
            overflow: hidden; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .club-logo-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .club-logo-placeholder { font-size: 22px; color: rgba(255,255,255,0.25); font-weight: 700; }

        .club-name {
            font-size: 17px; font-weight: 700; color: #fff;
            text-transform: uppercase; letter-spacing: 1.2px; max-width: 280px;
        }
        .club-address {
            font-size: 11px; color: rgba(255,255,255,0.45);
            display: flex; align-items: center; justify-content: center;
            gap: 4px; margin-top: 5px;
        }

        .map-legend {
            display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; justify-content: center;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 9px; color: #666; font-weight: 600; }
        .legend-dot { width: 10px; height: 10px; border-radius: 2px; border: 1px solid #444; }
        .legend-dot.free { background: #f0f0f0; border-color: #ccc; }
        .legend-dot.busy { background: #1a1a1a; }
        .legend-dot.sel { background: #8b1a1a; border-color: #ff4d4d; }

        .map-wrapper {
            flex: 1; position: relative; overflow: auto;
            background: #0a0a0a;
            -webkit-overflow-scrolling: touch;
        }
        .map-wrapper::before {
            content: ''; position: sticky; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139,26,26,0.4), transparent);
            display: block; z-index: 5;
        }
        .floor-canvas {
            position: relative; margin: 16px auto 24px;
            background: #0a0a0a;
            border: 1px solid #1e1e1e; border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.03);
            min-width: 320px; min-height: 280px;
        }
        .floor-canvas.has-bg {
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }
        .floor-canvas::after {
            content: ''; position: absolute; inset: 0; border-radius: 16px;
            background: rgba(0,0,0,0.55); pointer-events: none; z-index: 1;
        }
        .floor-canvas.has-bg .map-layer { z-index: 2; position: relative; }

        .map-layer { position: absolute; inset: 0; }

        .map-obj-wall { position: absolute; background: #fff; border-radius: 0; z-index: 2; pointer-events: none; }
        .map-obj-facility {
            position: absolute; border: 2px solid rgba(255,255,255,0.35); border-radius: 2px;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.5);
            text-transform: uppercase; letter-spacing: 0.5px; pointer-events: none; z-index: 3;
        }
        .map-obj-desk .desk-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.5); border-radius: 1px; }
        .map-obj-desk .desk-lbl { font-size: 8px; color: rgba(255,255,255,0.4); margin-top: 3px; text-transform: lowercase; }

        .zone-label {
            position: absolute; display: flex; align-items: center; gap: 5px;
            z-index: 10; pointer-events: none;
        }
        .zone-label-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .zone-label-text {
            font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.75);
            text-transform: lowercase; letter-spacing: 0.2px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.9);
        }

        .pc {
            position: absolute; width: 28px; height: 28px; border-radius: 3px;
            border: 2px solid; display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s, background 0.15s;
            z-index: 20; box-sizing: border-box;
        }
        .pc:active { transform: scale(0.94); }
        .pc.free { background: #f2f2f2; color: #111; }
        .pc.busy { background: #161616; border-color: #2a2a2a !important; color: #333 !important; cursor: default; }
        .pc.offline { background: #0d0d0d; border-color: #222 !important; opacity: 0.45; cursor: default; }
        .pc.selected {
            background: #8b1a1a !important; border-color: #ff4d4d !important;
            color: #fff !important; box-shadow: 0 0 14px rgba(255,77,77,0.45);
        }
        .pc.vip.free { background: #1a0a0a; border-color: #8b1a1a; color: #ff8a8a; }
        .pc.vip.selected { background: #ff4d4d !important; color: #000 !important; }

        .map-loading {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #555; font-size: 12px; font-weight: 600; z-index: 50;
        }

        .footer {
            flex-shrink: 0; background: #0c0c0c; padding: 16px 16px 28px;
            border-top: 1px solid #1a1a1a; z-index: 20;
        }
        .date-selector { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 14px; scrollbar-width: none; }
        .date-selector::-webkit-scrollbar { display: none; }
        .date-item {
            flex: 0 0 52px; height: 54px; background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06); border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
        }
        .date-item.active { background: #8b1a1a; border-color: #8b1a1a; color: #fff; }
        .date-item span { font-size: 9px; color: #666; text-transform: uppercase; }
        .date-item.active span { color: #f0c0c0; }
        .date-item b { font-size: 15px; font-weight: 700; }
        .info-box { margin-bottom: 16px; }
        .info-label { font-size: 11px; color: #666; margin-bottom: 3px; font-weight: 600; }
        .info-value { font-size: 14px; font-weight: 600; line-height: 1.5; }
        .info-value span { color: #ff6b6b; }
        .btn-confirm {
            width: 100%; padding: 17px; background: #2a2a2a; color: #555;
            border: none; border-radius: 14px; font-size: 14px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px; pointer-events: none;
        }
        .btn-confirm.active { background: linear-gradient(135deg, #a02020, #8b1a1a); color: #fff; pointer-events: auto; }

        .toast-container { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 9999; width: calc(100% - 32px); max-width: 360px; }
        .toast {
            background: rgba(22,22,22,0.97); color: #fff; padding: 12px 16px; border-radius: 12px;
            margin-bottom: 8px; border-left: 3px solid #8b1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600;
            animation: slideIn 0.3s ease-out forwards;
        }
        .toast.success { border-left-color: #4CAF50; }
        @keyframes slideIn { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideOut { to { transform: translateY(-12px); opacity: 0; } }
    </style>
</head>
<body>

    <div class="slide-header">
        <a href="javascript:history.back()" class="back-btn"><span class="material-symbols-outlined">arrow_back</span></a>
        <div class="club-logo-frame">
            <img id="clubLogoImg" class="club-logo-img" src="" alt="">
            <div id="clubLogoPlaceholder" class="club-logo-placeholder">…</div>
        </div>
        <h1 class="club-name" id="clubNameHeader">Загрузка…</h1>
        <div class="club-address" id="clubAddrHeader">
            <span class="material-symbols-outlined" style="font-size:13px">location_on</span>
            <span id="clubAddrText">—</span>
        </div>
        <div class="map-legend">
            <div class="legend-item"><span class="legend-dot free"></span> свободно</div>
            <div class="legend-item"><span class="legend-dot busy"></span> занято</div>
            <div class="legend-item"><span class="legend-dot sel"></span> ваш выбор</div>
        </div>
    </div>

    <div class="map-wrapper" id="mapWrapper">
        <div class="floor-canvas" id="floorCanvas">
            <div class="map-layer" id="mapObjectsLayer"></div>
            <div class="map-layer" id="zoneLabelsLayer"></div>
            <div class="map-layer" id="pcsLayer"></div>
            <div class="map-loading" id="mapLoading">Загрузка схемы…</div>
        </div>
    </div>

    <div class="footer">
        <div class="date-selector" id="dateSelector"></div>
        <div class="info-box">
            <div class="info-label">Выбрали</div>
            <div class="info-value" id="seatLabel"><span style="color:#555">не выбраны</span></div>
            <div class="info-label" style="margin-top:10px">Время</div>
            <div class="info-value" id="timeLabel">--:--</div>
        </div>
        <button class="btn-confirm" id="confirmBtn" type="button">Подтвердить бронирование</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        (function() { if (!localStorage.getItem('access_token')) window.location.replace('check.html'); })();

        const _API_ss = 'http://138.16.224.101:8000/';
        const _api_ss = axios.create({ baseURL: _API_ss, headers: { "ngrok-skip-browser-warning": "69420" } });
        _api_ss.interceptors.request.use(cfg => {
            const t = localStorage.getItem('access_token');
            if (t) cfg.headers.Authorization = `Bearer ${t}`;
            return cfg;
        });
        _api_ss.interceptors.response.use(r => r, async err => {
            if (err.response?.status === 401 && !err.config._retry) {
                err.config._retry = true;
                const rt = localStorage.getItem('refresh_token');
                if (rt) {
                    try {
                        const r = await axios.post(`${_API_ss}/auth/refresh`, {}, {
                            headers: { Authorization: `Bearer ${rt}`, "ngrok-skip-browser-warning": "69420" }
                        });
                        localStorage.setItem('access_token', r.data.access_token);
                        err.config.headers.Authorization = `Bearer ${r.data.access_token}`;
                        return _api_ss(err.config);
                    } catch { localStorage.clear(); window.location.href = 'check.html'; }
                } else { localStorage.clear(); window.location.href = 'check.html'; }
            }
            return Promise.reject(err);
        });
        document.addEventListener('DOMContentLoaded', async () => {
            try { await _api_ss.get('/users/me'); } catch { window.location.href = 'check.html'; }
        });
    </script>
    <script src="../js/seat.js"></script>
</body>
</html>
